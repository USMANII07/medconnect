<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MedConnect</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="signup-page">
    <header class="header">
        <a class="logo signup-header" href="../index.html">
            <span class="logo-icon" aria-hidden="true">✚</span>
            <span>MedConnect</span>
        </a>
        <div class="header-buttons">
            <a class="nav-login" href="../index.html">Home</a>
        </div>
    </header>

    <main class="signup-main">
        <section class="signup-card" aria-labelledby="loginTitle">
            <span class="section-tag">WELCOME BACK</span>
            <h1 id="loginTitle">Log in to MedConnect</h1>
            <p class="signup-intro">Sign in to continue to your pharmacy dashboard.</p>

            <form class="signup-form" id="loginForm">
                <label for="loginEmail">Email address
                    <input id="loginEmail" name="email" type="email" autocomplete="username" maxlength="254" required>
                </label>
                <label for="loginPassword">Password
                    <span class="password-field">
                        <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
                        <button class="password-toggle" type="button" id="toggleLoginPassword" aria-controls="loginPassword" aria-pressed="false">Show</button>
                    </span>
                </label>
                <p class="form-message" id="loginMessage" role="status" aria-live="polite"></p>
                <button class="signup-submit" id="loginSubmit" type="submit">Log In</button>
            </form>

            <p class="signup-footer">New to MedConnect? <a href="./signup.html">Create an account</a></p>
            <p class="signup-footer"><a href="../index.html">Back to MedConnect home</a></p>
        </section>
    </main>
    <script src="../main.js"></script>
</body>
</html>
